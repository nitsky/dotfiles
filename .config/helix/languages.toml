[[language]]
language-servers = ["oxfmt", "oxlint", "tailwind"]
name = "css"

[[language]]
language-servers = ["oxfmt", "oxlint", "tailwind"]
name = "html"

[[language]]
auto-format = true
language-servers = [{ except-features = ["format"], name = "typescript" }, "oxfmt", "oxlint"]
name = "javascript"

[[language]]
auto-format = true
language-servers = ["oxfmt", "oxlint"]
name = "json"

[[language]]
auto-format = true
language-servers = [{ except-features = ["format"], name = "typescript" }, "oxfmt", "oxlint", "tailwind"]
name = "jsx"

[[language]]
auto-format = true
language-servers = ["oxfmt", "oxlint"]
name = "markdown"

[[language]]
auto-format = true
file-types = ["mdx"]
formatter = { command = "prettier", args = ["--parser", "mdx"] }
grammar = "markdown"
indent = { tab-width = 2, unit = "\t" }
language-servers = ["mdx", "oxfmt", "oxlint", "tailwind"]
name = "mdx"
roots = []
scope = "source.mdx"

[[language]]
indent = { tab-width = 2, unit = "\t" }
name = "rust"

[[language]]
auto-format = true
file-types = [{ glob = "*.tgi.json" }]
grammar = "json"
indent = { tab-width = 2, unit = "\t" }
language-servers = ["tangram"]
name = "tangram-interface-json"
roots = []
scope = "source.tangram-interface-json"

[[language]]
auto-format = true
comment-token = "#"
file-types = [{ glob = "*.tgi.py" }]
grammar = "python"
indent = { tab-width = 4, unit = "    " }
language-servers = ["tangram"]
name = "tangram-interface-python"
roots = []
scope = "source.tangram-interface-python"

[[language]]
auto-format = true
comment-token = "//"
file-types = [{ glob = "*.tgi.ts" }]
grammar = "typescript"
indent = { tab-width = 2, unit = "\t" }
language-servers = ["tangram"]
name = "tangram-interface-typescript"
roots = []
scope = "source.tangram-interface-typescript"

[[language]]
auto-format = true
comment-token = "//"
file-types = [{ glob = "tangram.js" }, { glob = "*.tg.js" }]
grammar = "javascript"
indent = { tab-width = 2, unit = "\t" }
language-servers = ["tangram"]
name = "tangram-javascript"
roots = []
scope = "source.tangram-javascript"

[[language]]
auto-format = true
file-types = [{ glob = "tangram.json" }, { glob = "*.tg.json" }]
grammar = "json"
indent = { tab-width = 2, unit = "\t" }
language-servers = ["tangram"]
name = "tangram-json"
roots = []
scope = "source.tangram-json"

[[language]]
auto-format = true
comment-token = "#"
file-types = [{ glob = "tangram.py" }, { glob = "*.tg.py" }]
grammar = "python"
indent = { tab-width = 4, unit = "    " }
language-servers = ["tangram-python"]
name = "tangram-python"
roots = []
scope = "source.tangram-python"

[[language]]
auto-format = true
comment-token = "#"
file-types = [{ glob = "tangram.toml" }, { glob = "*.tg.toml" }]
grammar = "toml"
indent = { tab-width = 2, unit = "\t" }
language-servers = ["tangram"]
name = "tangram-toml"
roots = []
scope = "source.tangram-toml"

[[language]]
auto-format = true
comment-token = "//"
file-types = [{ glob = "tangram.ts" }, { glob = "*.tg.ts" }]
grammar = "typescript"
indent = { tab-width = 2, unit = "\t" }
language-servers = ["tangram"]
name = "tangram-typescript"
roots = []
scope = "source.tangram-typescript"

[[language]]
auto-format = true
comment-token = "#"
file-types = [{ glob = "tangram.yaml" }, { glob = "*.tg.yaml" }]
grammar = "yaml"
indent = { tab-width = 2, unit = "  " }
language-servers = ["tangram"]
name = "tangram-yaml"
roots = []
scope = "source.tangram-yaml"

[[language]]
auto-format = true
language-servers = [{ except-features = ["format"], name = "typescript" }, "oxfmt", "oxlint", "tailwind"]
name = "tsx"

[[language]]
auto-format = true
language-servers = [{ except-features = ["format"], name = "typescript" }, "oxfmt", "oxlint", "tailwind"]
name = "typescript"

[language-server.mdx]
args = ["--stdio"]
command = "mdx-language-server"

[language-server.oxfmt]
args = ["oxfmt", "--lsp"]
command = "bunx"

[language-server.oxlint]
args = ["oxlint", "--lsp"]
command = "bunx"

[language-server.rust-analyzer.config]
cargo = { features = "all" }
check = { command = "clippy" }
files = { watcher = "server" }

[language-server.tailwind]
args = ["--stdio"]
command = "tailwindcss-language-server"

[language-server.tangram]
args = ["-m", "client", "lsp"]
command = "tangram"

[language-server.tangram-python]
args = ["-d", "/Users/nitsky/tangram3/.tangram", "-m", "client", "lsp"]
command = "/Users/nitsky/tangram3/target/debug/tangram"

[language-server.typescript]
args = ["tsc", "--lsp", "--stdio"]
command = "bunx"
